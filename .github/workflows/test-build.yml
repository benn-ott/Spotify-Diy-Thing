name: Test compiling firmware

on:
  # Runs on all branches but main, when firmware or build config files change
  push:
    branches-ignore: ["main"]
    paths:
      - '**.ino'
      - '**.h'
      - '**.cpp'
      - '**.yml'
      - 'platformio.ini'
      - 'scripts/**'

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-v2-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # cryptography and requests are needed by scripts/generate_cert_bundle.py
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio cryptography requests

      # Display settings come from build_flags in platformio.ini,
      # so there's no need to copy User_Setup.h anymore
      - name: Build CYD
        run: platformio run -e cyd